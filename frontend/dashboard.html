<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n-key="seller_dashboard">Seller Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header class="dashboard-header">
            <div class="header-content">
                <h1><span data-i18n-key="welcome">Welcome</span>, <span id="userName"></span></h1>
                <div class="user-info">
                    <div style="text-align: right; padding: 10px; background: #fff; border-radius: 5px;">
                        <label for="lang-selector">Language: </label>
                        <select id="lang-selector">
                            <option value="en">English</option>
                            <option value="hi">हिन्दी (Hindi)</option>
                            <option value="te">తెలుగు (Telugu)</option>
                        </select>
                    </div>
                    <button id="logoutBtn" class="btn btn-secondary" data-i18n-key="logout_btn">Logout</button>
                </div>
            </div>
        </header>

        <section class="summary-cards">
            <div class="summary-card">
                <h3 data-i18n-key="total_credit">Total Credit</h3>
                <p id="totalCredit" class="amount credit">₹0.00</p>
            </div>
            <div class="summary-card">
                <h3 data-i18n-key="total_debit">Total Debit</h3>
                <p id="totalDebit" class="amount debit">₹0.00</p>
            </div>
            <div class="summary-card">
                <h3 data-i18n-key="balance">Balance</h3>
                <p id="balance" class="amount">₹0.00</p>
            </div>
        </section>

        <section class="dashboard-content">
            <div class="card">
                <h2 data-i18n-key="add_transaction">Add New Transaction</h2>
                <form id="transactionForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="transactionType" data-i18n-key="type">Type</label>
                            <select id="transactionType" required>
                                <option value="credit" data-i18n-key="credit">Credit (Money Received)</option>
                                <option value="debit" data-i18n-key="debit">Debit (Money Given)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="transactionAmount" data-i18n-key="amount">Amount</label>
                            <input type="number" id="transactionAmount" step="0.01" min="0.01" required>
                        </div>
                        <div class="form-group">
                            <label for="transactionDate" data-i18n-key="date">Date</label>
                            <input type="date" id="transactionDate" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="transactionDescription" data-i18n-key="description">Description</label>
                            <input type="text" id="transactionDescription" required>
                        </div>
                        <div class="form-group">
                            <label for="transactionCategory" data-i18n-key="category">Category (Optional)</label>
                            <input type="text" id="transactionCategory">
                        </div>
                        <div class="form-group">
                            <label for="transactionCustomerPhone" data-i18n-key="customer_phone">Customer Phone (Optional)</label>
                            <input type="tel" id="transactionCustomerPhone">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary" data-i18n-key="add_btn">Add Transaction</button>
                </form>
            </div>

            <div class="card">
                <div class="card-header">
                    <h2 data-i18n-key="all_transactions">All Transactions</h2>
                    <input type="search" id="searchInput" class="search-input" data-i18n-key="search_placeholder" placeholder="Search transactions...">
                </div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th data-i18n-key="date">Date</th>
                                <th data-i18n-key="type">Type</th>
                                <th data-i18n-key="description">Description</th>
                                <th data-i18n-key="category">Category</th>
                                <th data-i18n-key="customer_phone">Customer Phone</th>
                                <th data-i18n-key="amount">Amount</th>
                                <th data-i18n-key="actions">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="transactionsBody">
                            </tbody>
                    </table>
                </div>
            </div>
        </section>
    </div>

    <div id="editModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 data-i18n-key="edit_transaction">Edit Transaction</h2>
            <form id="editTransactionForm">
                <input type="hidden" id="editTransactionId">
                <div class="form-group">
                    <label for="editTransactionType" data-i18n-key="type">Type</label>
                    <select id="editTransactionType" required>
                        <option value="credit" data-i18n-key="credit">Credit (Money Received)</option>
                        <option value="debit" data-i18n-key="debit">Debit (Money Given)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="editTransactionAmount" data-i18n-key="amount">Amount</label>
                    <input type="number" id="editTransactionAmount" step="0.01" min="0.01" required>
                </div>
                <div class="form-group">
                    <label for="editTransactionDate" data-i18n-key="date">Date</label>
                    <input type="date" id="editTransactionDate" required>
                </div>
                <div class="form-group">
                    <label for="editTransactionDescription" data-i18n-key="description">Description</label>
                    <input type="text" id="editTransactionDescription" required>
                </div>
                <div class="form-group">
                    <label for="editTransactionCategory" data-i18n-key="category">Category (Optional)</label>
                    <input type="text" id="editTransactionCategory">
                </div>
                <div class="form-group">
                    <label for="editTransactionCustomerPhone" data-i18n-key="customer_phone">Customer Phone (Optional)</label>
                    <input type="tel" id="editTransactionCustomerPhone">
                </div>
                <div class="modal-actions">
                    <button type="button" id="cancelEditBtn" class="btn btn-secondary" data-i18n-key="cancel_btn">Cancel</button>
                    <button type="submit" class="btn btn-primary" data-i18n-key="save_btn">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
